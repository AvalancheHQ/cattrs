name: CodSpeed Benchmarks
'on':
  push:
    branches:
    - main
    tags:
    - '*'
    paths:
    - src/**.py
    - bench/**
    - .github/workflows/codspeed.yml
  pull_request:
    paths:
    - src/**.py
    - bench/**
    - .github/workflows/codspeed.yml
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  codspeed:
    name: Run CodSpeed benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6.1.0
      with:
        python-version: '3.14'
    - uses: hynek/setup-cached-uv@757bedc3f972eb7227a1aa657651f15a8527c817
    - name: Run CodSpeed benchmarks
      uses: CodSpeedHQ/action@v4
      with:
        upload-url: ${{ secrets.CODSPEED_STAGING_UPLOAD_URL }}
        mode: simulation
        run: uv run --with pytest-codspeed --with pytest-benchmark --group test --extra
          msgspec --extra orjson pytest --codspeed bench/
